[tools]
go = "1.24.4"
golangci-lint = "2.12.2"
goreleaser = "2.16.0"

[tasks.build]
description = "Build the mcp-matrix-send binary"
run = "go build -o mcp-matrix-send ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests"
run = "go test -v ./..."

[tasks.release]
description = "Run GoReleaser (snapshot)"
run = "goreleaser release --snapshot --clean"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf mcp-matrix-send dist"
